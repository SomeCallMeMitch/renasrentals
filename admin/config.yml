backend:
  name: git-gateway
  branch: codex/test-decap-cms

local_backend: true
publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "cms_preview"
    label: "CMS Preview Test"
    files:
      - name: "landing"
        label: "SDSU Landing Page Test Copy"
        file: "content/cms-preview.json"
        format: "json"
        fields:
          - label: "Meta"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Browser Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subhead", name: "subhead", widget: "text" }
              - { label: "Primary CTA", name: "primaryCta", widget: "string" }
              - { label: "Secondary CTA", name: "secondaryCta", widget: "string" }
          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
          - label: "Homes Section"
            name: "homes"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Note Under Cards", name: "note", widget: "text" }
          - label: "Property Cards"
            name: "properties"
            widget: "list"
            summary: "{{fields.address}}"
            fields:
              - { label: "Property ID", name: "id", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Lease Label", name: "leaseLabel", widget: "string" }
              - { label: "Benefit Line", name: "benefitLine", widget: "string" }
              - { label: "Best For Badge", name: "bestFor", widget: "string" }
              - { label: "Image Path", name: "image", widget: "string" }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
              - label: "Feature Bullets"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - label: "Group Options Section"
            name: "groupOptions"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Final CTA"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
